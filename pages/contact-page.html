<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/contact-page.css">

</head>


<body>

    <!--Class for reusable, id is for unique elements.-->

    <header id="frontpage-header">

        <nav id="front-page-nav">
            <a href="main-page.html">Home</a>
            <a href="about-me-page.html">About</a>
            <a href="funeral-memorials-page.html">Funerals & Memorials</a>
            <a href="kind-words-page.html">Kind Words</a>
            <a href="resources-page.html">Resources</a>
            <a href="contact-page.html">Contact</a>
        </nav>

    </header>



    <main id="contact-page">

        <div id="personal-information-div">

            <h3 id="name-title">Stephanie Lee</h3>

            <h1 id="wolf-title">WOLF</h1>

            <div id="ceremonie-div">

                <h3 id="ceremonie-title">ceremonies</h3>

                <hr id="contact-page-hr">

            </div>

            <p id="contact-page-description">
                Funeral & Memorial Celebrant
            </p>

            <p id="contact-page-location">
                Gold Coast | Queensland
            </p>

        </div>

        <hr id="form-seperator">

        <!--Contact form section-->

        <div id="contact-form-div">

            <h3 id="contact-form-contact-heading">
                CONTACT
            </h3>

            <h1 id="contact-form-enquiry-heading">
                Begin an Enquiry
            </h1>

            <hr id="contact-form-hr">
            
            <form id="contact-form">

                <div id="contact-form-row1">

                    <label for="name">Your Name *</label>

                    <label for="email">Email Address *</label>
                    

                </div>

                <div id="contact-form-row2">

                    <input type="text" id="name" name="name" required>

                    <input type="email" id="email" name="email" required>

                </div>

                <div id="contact-form-row3">

                    <label for="phone">Phone Number</label>

                </div>

                <div id="contact-form-row4">

                    <input type="tel" id="phone" name="phone">

                </div>
                

                <div id="contact-form-options">

                    <p>How would you prefer I contact you?</p>

                    <label>
                        <input type="checkbox" name="Phone" value="Phone">
                        Phone
                    </label>

                    <label>
                        <input type="checkbox" name="Email" value="Email">
                        Email
                    </label>
                </div>

                <div id="contact-form-row5">

                    <label for="message">A little about what you need (optional)</label>

                </div>

                <div id="contact-form-row6">

                    <textarea id="message" name="message" rows="20"></textarea>
                    
                </div>

                <button id="contact-page-button" role="button">
                    Send Enquiry
                </button>

                <hr id="contact-form-hr2">


            </form>

            <h3 id="contact-directly-h3">PREFER TO CONTACT ME DIRECTLY?</h3>

            <div id="contact-email-div">

                <svg class="contact-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5">

                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>

                </svg>

                <span>your@email.com</span>

            </div>

            <div id="contact-detail-location">
                
                <svg class="contact-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5">
                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                    <circle cx="12" cy="10" r="3"/>

                </svg>

                <span>Gold Coast | Queensland</span>

            </div>

        </div>


    </main>


</body>



</html>
